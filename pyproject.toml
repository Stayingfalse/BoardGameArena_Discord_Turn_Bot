[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bga-turn-bot"
version = "0.1.0"
description = "Self-hosted Discord bot that watches public Board Game Arena tables in spectator mode."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "discord.py>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "websockets>=13.0,<16.0",
    "aiohttp>=3.13.3,<4.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "python-socketio>=5.11.0,<6.0.0",
    "Pillow>=10.1.0,<13.0.0",
]

[project.scripts]
bga-turn-bot = "bga_turn.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bga_turn = ["schema.sql", "templates/*.html", "static/*.css", "static/*.js", "static/*.png", "static/fonts/*", "locales/*.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness checks only (pyflakes, syntax errors, bugbear); style is not enforced.
select = ["F", "E9", "B"]
